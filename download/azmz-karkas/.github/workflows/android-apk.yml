name: Android APK

# Сборка APK приложения водителя без локального Android SDK:
# закоммитьте этот репозиторий на GitHub — Actions соберёт APK и выложит его артефактом.
# Скачивание: страница репозитория → Actions → забег «Android APK» → Artifacts.

on:
  workflow_dispatch: {}        # ручной запуск кнопкой в UI
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Сборка debug-APK (подписан debug-ключом, сразу ставится на телефон)
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: azmz-driver-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
