name: Android APK

# Сборка APK модуля водителя из монорепозитория.
# Артефакт: Actions -> Android APK -> azmz-driver-apk.

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - 'driver/download/azmz-karkas/android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver/download/azmz-karkas/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Сборка debug-APK (debug-подпись, ставится на телефон)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: azmz-driver-apk
          path: driver/download/azmz-karkas/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
